<div class="body">
    <div class="form">
        <h2>Update Item</h2>
        <form [formGroup]="updateItemForm" (ngSubmit)="UpdateItem()">
            <div class="formElement">
                <label for="id">Item ID</label><br/>
                <input id="id" type="number" formControlName="id" placeholder="id" readonly /><br>
            </div>
            <app-form-input label="Name" type="text" placeholder="enter item name" formControlName="name" />
            <app-form-input label="Price" type="number" placeholder="enter item price" formControlName="price" />
            <app-form-input label="Stock Quantity" type="number" placeholder="enter item stock Quantity" formControlName="stockQuantity" />
            <select class="selectedCategory" id="categoryName" formControlName="categoryName"  >
            <option [value]="null">Select category</option>
                @for (category of allCategories(); track $index) {
                    <option [value]="category.name" >{{ category.name }}</option>
                }
            </select><br/>
            <div class="form-actions">
                <button type="submit" class="btn" [disabled]="updateItemForm.invalid">Update Item</button>
            </div>
        </form>
    </div>
</div>
