<div class="page">
    <div class="page-header">
        <div>
            <span class="page-label">Financial</span>
            <h2>Receipts</h2>
            <p>View all payment receipts and their order details</p>
        </div>
    </div>
    <div class="receipts">
        @for (item of allReceipts(); track item.orderId) {
            <div class="receipt">
                <div class="receipt-header">
                    <span class="receipt-label">Receipt</span>
                    <span class="order-id">Order {{ item.orderId }}</span>
                </div>
                <div class="receipt-info">
                    <div class="info-item">
                        <span>Total Amount</span>
                        <strong class="amount">{{ item.totalAmount }}</strong>
                    </div>
                    <div class="info-item">
                        <span>Created At</span>
                        <strong>{{ item.createAt }}</strong>
                    </div>
                </div>
                <button class="details" (click)="viewDetials(item.orderId)"> View Details →</button>
            </div>
        }
        @empty {
            <div class="empty">
                <h3>No Receipts Found</h3>
                <p>There are currently no receipts available.</p>
            </div>
        }
    </div>
</div>
