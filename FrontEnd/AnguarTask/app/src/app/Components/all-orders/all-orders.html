<h2>orders</h2>
<div class="orders">
    @for(item of orders();track $index;let i=$index)
    {
         <div class="order">
            <h2>{{item.status}}</h2>
            <p>{{item.totalAmount}}</p> 
            <button class="details" (click)="ViewDetails(item.id)">view details</button>
        </div>
    }
    @empty {
            <p>orders are not found</p>
        }
</div>
