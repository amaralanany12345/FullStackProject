<div class="order-details-page">
        <div class="order-header">
            <div>
                <span class="page-label">Order Details</span>
                <h1>Order {{ order()?.id }}</h1>
            </div>
            <div class="total-box">
                <span>Total Amount</span>
                <strong>{{ order()?.totalAmount }}</strong>
            </div>
        </div>
        <div class="items-section">
            <div class="section-header">
                <h2>Order Items</h2>
                <span>{{ orderCartItems().length }} items</span>
            </div>
            <div class="orders">
                @for (orderItem of orderCartItems();track orderItem.itemId) {
                    <app-cart-item-details [cartItem]="orderItem" mode="view"></app-cart-item-details>
                }
                @empty {
                    <div class="empty">
                        <h3>No Items Found</h3>
                        <p>This order doesn't contain any items.</p>
                    </div>
                }
            </div>
        </div>
</div>
