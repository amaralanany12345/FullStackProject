<h1>{{totalPrice()}}</h1>
<button class="details" (click)="ApplyPayment()">Apply Payment</button>
<div class="orders">
    @for(item of orderCartItems();track $index;let i=$index)
    {
         <div class="order">
            <h2>{{item.price}}</h2>
            <p>{{item.quantity}}</p> 
            <button class="details" (click)="DeleteCartItem(item.itemId)" >Delete</button>
            <button class="details" (click)="Increase(item)" >+</button>
            <button class="details" (click)="Decrease(item)" >-</button>
        </div>
    }
</div>
