<button class="btn" (click)="ConfirmPayment()" >confirm payment</button>
<h2>Total price: {{order()?.totalAmount}} $</h2>
<div class="orders">
    @for(orderItem of orderItems();track $index;let i=$index)
    {
         <div class="order">
             <h2>{{orderItem.itemName}}</h2> 
            <h3>Price :{{orderItem.price}}</h3>
            <h4>Qnt: {{orderItem.quantity}}</h4> 
        </div>
    }
</div>
